<script>
    const parentdiv = document.querySelector('.parent');
    /* console.log(parentdiv);

    for (let i = 0; i < parentdiv.children.length; i++) {

    parentdiv.children[1].style.color="orange";

    /* console.log(dayone);

    //console.log(parentdiv.childNodes); //NodeList(13)

    const creatediv = document.createElement('div');
    creatediv.id=Math.round(Math.random() * 10 + 1);
    creatediv.className = "main";
    creatediv.style.backgroundColor = "green";
    creatediv.style.padding = "10px";
    creatediv.setAttribute("title","generated");
    const addText = document.createTextNode("Create a new Text");
    creatediv.appendChild(addText);
    document.body.appendChild(creatediv)

    //Using Function
    const colors = ["red","yellow","blue","orange"];
    const texts = ["This is red","This is red yellow","This is red blue","This is red orange"];
    function colorChange(text,color){
        const colorDiv = document.createElement('div');
        colorDiv.className="outer";
        const AddTextNote = document.createTextNode(text)
        colorDiv.appendChild(AddTextNote);
        colorDiv.style.backgroundColor = color;
        //const afterDiv = document.getElementsByClassName('.main');
        //afterDiv.after(colorDiv);
        document.body.appendChild(colorDiv)
    }
    for (let i = 0; i < colors.length; i++) {
        colorChange(texts[i],colors[i]);
        
    }
    
</script>
