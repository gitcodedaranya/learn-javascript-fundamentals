<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit and remove elements in DOM</title>
</head>
<body>
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    function addlanguage(language){
        const li = document.createElement('li');
        li.innerHTML = `${language}`;
        document.querySelector(".language").appendChild(li);
    }
    addlanguage("PHP");
    addlanguage("Laravel");

     function optianguage(lang){ //this approch is recomendable
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(lang));
        document.querySelector(".language").appendChild(li);

     }
     optianguage('golang');

     //Edit
     const secondLang = document.querySelector('li:nth-child(2)');
     //secondLang.innerHTML="Java";
    const newLi = document.createElement('li');
    newLi.textContent = "Node";
    secondLang.replaceWith(newLi);

    //edit
    const firstLang = document.querySelector('li:first-child');
    firstLang.outerHTML = '<li>PHP</li>';

    //remove
    const latLang = document.querySelector('li:last-child');
    latLang.remove();

</script>
</html>
